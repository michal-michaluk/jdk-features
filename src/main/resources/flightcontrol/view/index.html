<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight Control</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 24px; color: #222; }
    h1 { font-size: 1.2rem; }
    .bar { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
    button { font-size: 1rem; padding: 6px 14px; }
    svg { border: 1px solid #ccc; background: #f6f8fa; max-width: 100%; }
    .hint { color: #666; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Flight Control</h1>
  <div class="bar">
    <button onclick="load()">Refresh</button>
    <label><input type="checkbox" id="auto" checked onchange="toggleAuto()"> Auto-refresh (2s)</label>
    <span class="hint">Reads <code>GET /aircraft</code> + <code>GET /areas</code> (same origin).
      Serve this file from your local server; the scene re-polls automatically or manually.</span>
  </div>
  <svg id="map" width="800" height="600" viewBox="0 0 80 60"></svg>
  <pre id="err" class="hint"></pre>

  <script>
    /*
     * Expected JSON contract (provided to participants — the server must return this):
     *   GET /aircraft -> [ { "id": "...", "label": "...", "callsign": "...",
     *                        "pos": {"x": number, "y": number},
     *                        "vel": {"dx": number, "dy": number} }, ... ]
     *   GET /areas    -> [ { "kind": "circle", "label": "...",
     *                        "center": {"x": number, "y": number}, "radius": number, "props": {} },
     *                      { "kind": "polygon", "label": "...",
     *                        "vertices": [ {"x": number, "y": number}, ... ], "props": {} }, ... ]
     *
     * Coordinates are dimensionless; the view maps them onto a 80x60 canvas with y flipped.
     */
    const W = 80, H = 60;
    const PAD = 3;                       // padding around the fitted scene
    const svg = document.getElementById('map');
    const err = document.getElementById('err');

    // World -> view transform, auto-fitted to the data bounds (y flipped).
    let toView = ([x, y]) => [x, y];
    let scale = 1;

    function svgEl(tag, attrs) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      return el;
    }

    async function load() {
      err.textContent = '';
      try {
        const [aircraft, areas] = await Promise.all([
          fetch('/aircraft').then(r => r.json()),
          fetch('/areas').then(r => r.json()),
        ]);
        draw(aircraft, areas);
      } catch (e) {
        err.textContent = 'Error: ' + e;
        svg.innerHTML = '';
      }
    }

    // ---- auto-refresh (poll + redraw) ----
    let autoTimer = null;
    const AUTO_MS = 2000;
    function toggleAuto() {
      if (document.getElementById('auto').checked) startAuto(); else stopAuto();
    }
    function startAuto() {
      stopAuto();
      autoTimer = setInterval(load, AUTO_MS);
    }
    function stopAuto() {
      if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    }

    // Fit the world once (areas + aircraft) and KEEP the transform: because areas never
    // change and we never re-fit, the areas stay put on screen and only aircraft move (the
    // demo server bounces aircraft so they stay inside the fitted window).
    let fitted = false;
    function fit(aircraft, areas) {
      const xs = [], ys = [];
      const push = (x, y) => { xs.push(x); ys.push(y); };
      (areas || []).forEach(a => {
        if (a.kind === 'circle') { push(a.center.x - a.radius, a.center.y - a.radius); push(a.center.x + a.radius, a.center.y + a.radius); }
        else (a.vertices || []).forEach(v => push(v.x, v.y));
      });
      (aircraft || []).forEach(a => { push(a.pos.x, a.pos.y); push(a.pos.x + a.vel.dx, a.pos.y + a.vel.dy); });
      if (!xs.length) { xs.push(0, 10); ys.push(0, 10); }
      let minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
      const spanX = Math.max(maxX - minX, 1e-6), spanY = Math.max(maxY - minY, 1e-6);
      scale = Math.min((W - 2 * PAD) / spanX, (H - 2 * PAD) / spanY);
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
      toView = ([x, y]) => { const sx = (x - cx) * scale + W / 2; const sy = (y - cy) * scale + H / 2; return [sx, H - sy]; };
    }

    function draw(aircraft, areas) {
      svg.innerHTML = '';
      if (!fitted) { fit(aircraft, areas); fitted = true; }
      svg.appendChild(svgEl('rect', { x: 0, y: 0, width: W, height: H, fill: '#f6f8fa', stroke: '#ccc' }));
      (areas || []).forEach(a => drawArea(a));
      (aircraft || []).forEach(a => drawAircraft(a));
    }

    function drawArea(a) {
      if (a.kind === 'circle') {
        const [cx, cy] = toView([a.center.x, a.center.y]);
        svg.appendChild(svgEl('circle', {
          cx: cx, cy: cy, r: a.radius * scale,
          fill: 'rgba(150,150,150,.35)', stroke: '#888',
        }));
        svg.appendChild(svgEl('text', { x: cx - a.radius, y: cy - a.radius, 'font-size': 2.6, fill: '#333' })).textContent = a.label || '';
      } else if (a.kind === 'polygon') {
        const pts = a.vertices.map(v => toView([v.x, v.y]).join(',')).join(' ');
        svg.appendChild(svgEl('polygon', { points: pts, fill: 'rgba(150,150,150,.35)', stroke: '#888' }));
        const ys = a.vertices.map(v => toView([v.x, v.y])[1]);
        svg.appendChild(svgEl('text', { x: Math.min(...a.vertices.map(v => toView([v.x, v.y])[0])), y: Math.min(...ys) - 1, 'font-size': 2.6, fill: '#333' })).textContent = a.label || '';
      }
    }

    function drawAircraft(a) {
      const [x, y] = toView([a.pos.x, a.pos.y]);
      const [x2, y2] = toView([a.pos.x + a.vel.dx, a.pos.y + a.vel.dy]);
      svg.appendChild(svgEl('circle', { cx: x, cy: y, r: 1.6, fill: '#d63d2a' }));
      svg.appendChild(svgEl('line', { x1: x, y1: y, x2: x2, y2: y2, stroke: '#d63d2a', 'stroke-width': 0.3 }));
      svg.appendChild(svgEl('text', { x: x + 2, y: y - 2, 'font-size': 2.6, fill: '#333' })).textContent = (a.label || '') + ' ' + (a.callsign || '');
    }

    load();
    startAuto();
  </script>
</body>
</html>
